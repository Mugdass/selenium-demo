name: Selenium CI/CD

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Install dependencies
        run: mvn install -DskipTests

      - name: Install ffmpeg and Xvfb
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb

      - name: Run Selenium tests with video recording
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1280x720x24 &
          export DISPLAY=:99
          XVFB_PID=$!

          # Wait for Xvfb to initialize
          sleep 1

          # Start ffmpeg to record the virtual display
          ffmpeg -y -video_size 1280x720 -framerate 10 -f x11grab -i :99 selenium-video.mp4 &
          FFMPEG_PID=$!

          # Run Maven tests
          mvn test

          # Stop ffmpeg gracefully and wait for it
          kill -INT $FFMPEG_PID
          wait $FFMPEG_PID || true

          # Stop Xvfb
          kill $XVFB_PID

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-video
          path: selenium-video.mp4
